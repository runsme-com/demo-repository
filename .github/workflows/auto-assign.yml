# 定义该 GitHub‑Actions 工作流对外显示名称
name: Auto Assign

# 工作流触发规则配置
on:
  issues:
    # 仅在新建 Issue 的时候触发
    types: [opened]
  pull_request:
    # 仅在新建PR的时候触发
    types: [opened]

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: 'Auto-assign issue'
      uses: pozil/auto-assign-issue@v1
      with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: Skixkk
          numOfAssignee: 1